name: CD Pipeline (Build & Push to Docker Hub)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || 'mos124' }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Build & Push Backend ──────────────────────────
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            mos124/e-utilities-backend:latest
            mos124/e-utilities-backend:${{ github.sha }}

      # ── Build & Push Frontend ─────────────────────────
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            mos124/e-utilities-frontend:latest
            mos124/e-utilities-frontend:${{ github.sha }}

