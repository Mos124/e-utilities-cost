name: CD Pipeline (Build & Push to Docker Hub)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker Hub Secret
        id: check-secrets
        run: |
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "::warning ::DOCKER_PASSWORD secret is not set! Skipping Docker Hub push."
            echo "has_secret=false" >> $GITHUB_OUTPUT
          else
            echo "has_secret=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: steps.check-secrets.outputs.has_secret == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check-secrets.outputs.has_secret == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check-secrets.outputs.has_secret == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || 'mos124' }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Build & Push Backend ──────────────────────────
      - name: Build and Push Backend Image
        if: steps.check-secrets.outputs.has_secret == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            mos124/e-utilities-backend:latest
            mos124/e-utilities-backend:${{ github.sha }}

      # ── Build & Push Frontend ─────────────────────────
      - name: Build and Push Frontend Image
        if: steps.check-secrets.outputs.has_secret == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            mos124/e-utilities-frontend:latest
            mos124/e-utilities-frontend:${{ github.sha }}
